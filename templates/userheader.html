<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader Dashboard - The Daily Chronicle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-newspaper"></i> The Chronicle</h2>
            <p>READER PORTAL</p>
        </div>
        
        <div class="nav-menu">
            <a href="user_home" class="active">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="places_finder">
                <i class="fas fa-check-circle"></i>
                <span>Check</span>
            </a>
            
            <a href="#">
                <i class="fas fa-clock"></i>
                <span>Reading History</span>
            </a>
            <a href="#">
                <i class="fas fa-user"></i>
                <span>My Profile</span>
            </a>
        </div>

        <div class="logout-btn">
            <a href="/login">
                <i class="fa fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>
   <!-- Main Content -->
    <div class="main-content">
        <!-- Newspaper Header -->
        <div class="newspaper-header">
            <div class="masthead">
                <h1>THE DAILY CHRONICLE</h1>
                <div class="tagline">ALL THE NEWS THAT'S FIT TO PRINT</div>
            </div>
            <div class="edition-info">
                <span>READER EDITION - VOL. CXLII</span>
                <span>WEDNESDAY, DECEMBER 10, 2025</span>
            </div>
        </div>
