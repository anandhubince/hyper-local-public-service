    <script>
document.addEventListener("DOMContentLoaded", function () {
    function update() {
        const now = new Date();
        document.querySelector(".day").textContent =
            now.toLocaleDateString('en-US', { weekday: 'long' });

        document.querySelector(".datetime").textContent =
            now.toLocaleString();
    }
    update();
    setInterval(update, 1000);
});
</script>
